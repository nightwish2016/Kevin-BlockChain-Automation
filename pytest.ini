[pytest]
# Pytest configuration file
minversion = 7.0
addopts = -ra -q --tb=short --alluredir=allure-results
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    network: marks tests that require network connectivity
    contract: marks tests that interact with smart contracts
    blockchain: marks tests that query blockchain data
    smoke: marks tests as smoke tests (critical happy path scenarios)
    regression: marks tests as regression tests (all scenarios including edge cases)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning